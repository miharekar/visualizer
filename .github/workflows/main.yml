name: Main Branch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  call-ruby-tests:
    name: Ruby Tests
    uses: ./.github/workflows/ruby-tests.yml
    secrets: inherit

  build-image:
    name: Build Image (${{ matrix.platform }})
    needs: call-ruby-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Log in to GHCR
        run: op read "op://Kamal/Visualizer Hetzner/REGISTRY_PASSWORD" | docker login ghcr.io --username miharekar --password-stdin
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: service=visualizer
          outputs: type=image,name=ghcr.io/miharekar/visualizer,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    name: Merge Image
    needs: build-image
    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Log in to GHCR
        run: op read "op://Kamal/Visualizer Hetzner/REGISTRY_PASSWORD" | docker login ghcr.io --username miharekar --password-stdin
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_SHA}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}"
        env:
          IMAGE: ghcr.io/miharekar/visualizer

  deploy:
    name: Deploy Production
    needs: merge-image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hvapp

      - name: Configure SSH host keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp .github/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: bundle exec kamal deploy --skip-push --version "$GITHUB_SHA"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
