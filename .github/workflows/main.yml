name: Main Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  call-ruby-tests:
    name: Ruby Tests
    uses: ./.github/workflows/ruby-tests.yml
    secrets: inherit

  build-image:
    name: Build Image
    needs: call-ruby-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Read Ruby version
        id: ruby-version
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: RUBY_VERSION=${{ steps.ruby-version.outputs.version }}
          platforms: ${{ matrix.platform }}
          labels: service=visualizer
          tags: |
            ghcr.io/maxrink/visualizer:${{ github.sha }}
            ghcr.io/maxrink/visualizer:latest
          push: true

      - name: Build and push Hot Cell
        uses: docker/build-push-action@v7
        with:
          context: hotcell
          build-args: RUBY_VERSION=${{ steps.ruby-version.outputs.version }}
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/maxrink/visualizer-hotcell:${{ github.sha }}
            ghcr.io/maxrink/visualizer-hotcell:latest
          push: true
