name: Ruby Tests
on: workflow_call
permissions:
  contents: read
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start system dependency installation
        run: |
          sudo systemd-run --unit=install-ci-dependencies --no-block \
            --property=Type=oneshot --property=RemainAfterExit=yes \
            /bin/bash -e -c 'apt-get update && apt-get install --no-install-recommends -y libvips'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Wait for system dependency installation
        run: |
          sudo systemctl start install-ci-dependencies.service
          sudo journalctl --unit=install-ci-dependencies --no-pager

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Start system dependency installation
        run: |
          sudo systemd-run --unit=install-ci-dependencies --no-block \
            --property=Type=oneshot --property=RemainAfterExit=yes \
            /bin/bash -e -c 'apt-get update && apt-get install --no-install-recommends -y libpq-dev libvips'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Wait for system dependency installation
        run: |
          sudo systemctl start install-ci-dependencies.service
          sudo journalctl --unit=install-ci-dependencies --no-pager

      - name: Setup database
        run: bin/rails db:test:prepare

      - name: Run unit tests
        run: bin/rails test

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run JavaScript tests
        run: node --test test/javascript/*_test.mjs

      - name: Install browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/journal-browser" playwright@1.63.0
          "$RUNNER_TEMP/journal-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run browser regressions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/journal-browser/node_modules/playwright
          JOURNAL_BROWSER_URL: http://localhost:3000
        run: |
          bin/rails tailwindcss:build
          bin/rails server -p 3000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://localhost:3000/up
          node --test test/browser/journal_test.mjs
